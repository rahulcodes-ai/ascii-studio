<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHENO ASCII STUDIO — Real-Time 7-Bit Video Engine</title>
  <style>
    :root {
      --bg: #030407;
      --panel: #0b0d14;
      --panel-2: #141824;
      --border: #232a3d;
      --cyan: #00f0ff;
      --pink: #ff2a85;
      --green: #39ff14;
      --text: #f1f5f9;
      --muted: #8b9bb4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Courier New", Courier, ui-monospace, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 48px;
    }

    .app {
      width: 100%;
      max-width: 960px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .brand h1 {
      font-size: 1.3rem;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, var(--pink), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .stats-pill {
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      color: var(--cyan);
      font-weight: bold;
    }

    .stage-wrap {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
    }

    canvas#asciiCanvas {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }

    .rec-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      display: none;
      animation: blink 1s infinite;
    }

    @keyframes blink { 50% { opacity: 0.35; } }

    .controls-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .ctrl label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .ctrl select,
    .ctrl input[type="range"] {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      flex: 1 1 150px;
      padding: 11px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
      text-align: center;
    }

    .btn:hover { border-color: var(--cyan); color: var(--cyan); }

    .btn-primary {
      background: linear-gradient(90deg, var(--pink), var(--cyan));
      color: #000;
      border: none;
    }

    .btn-primary:hover { color: #000; opacity: 0.92; }

    .btn-rec {
      border-color: #ef4444;
      color: #ef4444;
    }

    .btn-rec.recording {
      background: #ef4444;
      color: #fff;
    }

    .studio-footer {
      text-align: center;
      margin-top: 22px;
      padding: 15px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .studio-badge {
      font-size: 0.86rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .studio-badge span { color: var(--cyan); }
    .creator-line { font-size: 0.78rem; color: var(--text); margin-bottom: 4px; }
    .creator-line strong { color: var(--green); }
    .copyright { font-size: 0.7rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>PHENO ASCII STUDIO</h1>
        <p>Pure 7-Bit ASCII Video Renderer • No Unicode Blocks • No Video Overlay</p>
      </div>
      <div class="stats-pill" id="charCount">0 CHARS / FRAME</div>
    </header>

    <div class="stage-wrap">
      <canvas id="asciiCanvas" width="960" height="540"></canvas>
      <div class="rec-badge" id="recBadge">● REC</div>
    </div>

    <div class="controls-card">
      <div class="ctrl">
        <label>ASCII DENSITY (<span id="colsVal">160</span> COLS)</label>
        <input type="range" id="colsRange" min="80" max="260" step="10" value="160" />
      </div>

      <div class="ctrl">
        <label>COLOR MODE</label>
        <select id="colorMode">
          <option value="true">True Video Color (4K Vibe)</option>
          <option value="cyber">Cyberpunk Neon (Pink/Cyan)</option>
          <option value="matrix">Matrix Hacker Green</option>
          <option value="mono">Classic White Terminal</option>
        </select>
      </div>

      <div class="ctrl">
        <label>7-BIT CHARSET</label>
        <select id="charSet">
          <option value="dense">Ultra Detailed (70 chars)</option>
          <option value="classic">Classic Crisp (10 chars)</option>
          <option value="binary">Cyber Binary (0 / 1)</option>
        </select>
      </div>

      <div class="ctrl">
        <label>CONTRAST BOOST (<span id="contrastVal">1.3</span>x)</label>
        <input type="range" id="contrastRange" min="0.8" max="2.2" step="0.1" value="1.3" />
      </div>
    </div>

    <div class="btn-row">
      <label class="btn btn-primary" for="videoInput">📂 UPLOAD MP4 / WEBM VIDEO</label>
      <input type="file" id="videoInput" accept="video/*" style="display:none;" />
      <button class="btn" id="playPauseBtn" onclick="togglePlay()">⏸ PAUSE / PLAY</button>
      <button class="btn btn-rec" id="recBtn" onclick="toggleRecord()">🔴 RECORD ASCII VIDEO</button>
      <button class="btn" onclick="savePNG()">📸 SAVE 4K FRAME PNG</button>
    </div>

    <footer class="studio-footer">
      <div class="studio-badge">⚡ BUILT BY <span>PHENO STUDIO</span></div>
      <div class="creator-line">Creator: <strong>Rahul</strong> • 100% Client-Side HTML5 Canvas</div>
      <div class="copyright">© 2026 Pheno Studio. All Rights Reserved.</div>
    </footer>
  </div>

  <!-- Hidden elements for frame sampling -->
  <video id="srcVideo" loop muted playsinline style="display:none;"></video>
  <canvas id="sampleCanvas" style="display:none;"></canvas>

  <script>
    const asciiCanvas = document.getElementById("asciiCanvas");
    const aCtx = asciiCanvas.getContext("2d", { alpha: false });
    const sampleCanvas = document.getElementById("sampleCanvas");
    const sCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });
    const video = document.getElementById("srcVideo");

    const charSets = {
      dense: " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
      classic: " .:-=+*#%@",
      binary: " 01"
    };

    let useDemo = true;
    let isPaused = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    const colsRange = document.getElementById("colsRange");
    const contrastRange = document.getElementById("contrastRange");
    const colorModeEl = document.getElementById("colorMode");
    const charSetEl = document.getElementById("charSet");

    colsRange.oninput = () => document.getElementById("colsVal").textContent = colsRange.value;
    contrastRange.oninput = () => document.getElementById("contrastVal").textContent = contrastRange.value;

    // Upload user video
    document.getElementById("videoInput").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      video.src = url;
      video.play();
      useDemo = false;
      isPaused = false;
    });

    function togglePlay() {
      if (useDemo) {
        isPaused = !isPaused;
        return;
      }
      if (video.paused) { video.play(); isPaused = false; }
      else { video.pause(); isPaused = true; }
    }

    function savePNG() {
      const a = document.createElement("a");
      a.download = "pheno-ascii-frame.png";
      a.href = asciiCanvas.toDataURL("image/png");
      a.click();
    }

    function toggleRecord() {
      const btn = document.getElementById("recBtn");
      const badge = document.getElementById("recBadge");

      if (!isRecording) {
        const stream = asciiCanvas.captureStream(30);
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9" });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "pheno-ascii-video.webm";
          a.click();
        };
        mediaRecorder.start();
        isRecording = true;
        btn.classList.add("recording");
        btn.textContent = "⏹ STOP & DOWNLOAD";
        badge.style.display = "block";
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.classList.remove("recording");
        btn.textContent = "🔴 RECORD ASCII VIDEO";
        badge.style.display = "none";
      }
    }

    // Built-in animated Cyberpunk Neon scene (runs before any video is uploaded)
    function drawDemoToSample(w, h, t) {
      const g = sCtx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, "#120428");
      g.addColorStop(0.5, "#3b0764");
      g.addColorStop(1, "#090d1f");
      sCtx.fillStyle = g;
      sCtx.fillRect(0, 0, w, h);

      // Moving neon orbs (Blade Runner vibe)
      const cx = w * 0.5 + Math.sin(t * 0.0012) * (w * 0.22);
      const cy = h * 0.48 + Math.cos(t * 0.0015) * (h * 0.12);

      const orb1 = sCtx.createRadialGradient(cx, cy, 2, cx, cy, w * 0.34);
      orb1.addColorStop(0, "#ff4da6");
      orb1.addColorStop(0.45, "#a855f7");
      orb1.addColorStop(1, "rgba(0,0,0,0)");
      sCtx.fillStyle = orb1;
      sCtx.fillRect(0, 0, w, h);

      const cx2 = w * 0.5 - Math.sin(t * 0.001) * (w * 0.28);
      const cy2 = h * 0.55;
      const orb2 = sCtx.createRadialGradient(cx2, cy2, 2, cx2, cy2, w * 0.28);
      orb2.addColorStop(0, "#00f0ff");
      orb2.addColorStop(1, "rgba(0,0,0,0)");
      sCtx.fillStyle = orb2;
      sCtx.fillRect(0, 0, w, h);

      // Center holographic ring
      sCtx.strokeStyle = "#ffffff";
      sCtx.lineWidth = Math.max(2, w * 0.015);
      sCtx.beginPath();
      sCtx.arc(w / 2, h / 2, h * 0.24, t * 0.002, t * 0.002 + Math.PI * 1.4);
      sCtx.stroke();
    }

    function renderFrame(time) {
      requestAnimationFrame(renderFrame);
      if (isPaused) return;

      const cols = parseInt(colsRange.value, 10);
      const aspect = (!useDemo && video.videoWidth) ? (video.videoHeight / video.videoWidth) : (9 / 16);
      const rows = Math.max(24, Math.floor(cols * aspect * 0.52)); // char aspect correction

      document.getElementById("charCount").textContent = `${(cols * rows).toLocaleString()} CHARS / FRAME`;

      if (sampleCanvas.width !== cols || sampleCanvas.height !== rows) {
        sampleCanvas.width = cols;
        sampleCanvas.height = rows;
      }

      if (useDemo) {
        drawDemoToSample(cols, rows, time);
      } else if (video.readyState >= 2) {
        sCtx.drawImage(video, 0, 0, cols, rows);
      } else {
        return;
      }

      const imgData = sCtx.getImageData(0, 0, cols, rows).data;
      const chars = charSets[charSetEl.value];
      const contrast = parseFloat(contrastRange.value);
      const mode = colorModeEl.value;

      // Output canvas setup
      const outW = 960;
      const outH = Math.round(outW * aspect);
      if (asciiCanvas.width !== outW || asciiCanvas.height !== outH) {
        asciiCanvas.width = outW;
        asciiCanvas.height = outH;
      }

      const cellW = outW / cols;
      const cellH = outH / rows;

      aCtx.fillStyle = "#020205";
      aCtx.fillRect(0, 0, outW, outH);
      aCtx.font = `bold ${Math.ceil(cellH * 1.15)}px "Courier New", monospace`;
      aCtx.textBaseline = "top";

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const i = (y * cols + x) * 4;
          let r = imgData[i];
          let g = imgData[i + 1];
          let b = imgData[i + 2];

          // Apply contrast
          r = Math.min(255, Math.max(0, (r - 128) * contrast + 128));
          g = Math.min(255, Math.max(0, (g - 128) * contrast + 128));
          b = Math.min(255, Math.max(0, (b - 128) * contrast + 128));

          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          const charIdx = Math.min(chars.length - 1, Math.floor(lum * chars.length));
          const ch = chars[charIdx];
          if (ch === " ") continue;

          if (mode === "true") {
            aCtx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
          } else if (mode === "cyber") {
            aCtx.fillStyle = lum > 0.55 ? `rgb(0, ${Math.min(255, (lum * 280)|0)}, 255)` : `rgb(255, 42, ${Math.min(255, (lum * 260)|0)})`;
          } else if (mode === "matrix") {
            aCtx.fillStyle = `rgb(20, ${Math.min(255, (lum * 255 + 40)|0)}, 40)`;
          } else {
            const v = Math.min(255, (lum * 255 + 30)|0);
            aCtx.fillStyle = `rgb(${v},${v},${v})`;
          }

          aCtx.fillText(ch, x * cellW, y * cellH);
        }
      }
    }

    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
